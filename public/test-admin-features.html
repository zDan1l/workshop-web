<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Features Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .test-container {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f8f9fa;
        }
        .test-section h3 {
            color: #667eea;
            margin-top: 0;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 80%;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Admin Features Test</h1>

        <!-- Test 1: Add Queue -->
        <div class="test-section">
            <h3>1. Test Tambah Antrian</h3>
            <input type="text" id="testNama" value="Test Walk-in Guest" placeholder="Nama antrian">
            <button onclick="testTambahAntrian()">Test Tambah Antrian</button>
            <div id="tambahStatus" class="status info">Klik tombol untuk test tambah antrian</div>
        </div>

        <!-- Test 2: Recall Queue -->
        <div class="test-section">
            <h3>2. Test Panggil Ulang</h3>
            <input type="number" id="recallId" value="1" placeholder="ID antrian">
            <button onclick="testRecall()">Test Panggil Ulang</button>
            <div id="recallStatus" class="status info">Klik tombol untuk test panggil ulang</div>
        </div>

        <!-- Test 3: Check Routes -->
        <div class="test-section">
            <h3>3. Test Routes</h3>
            <button onclick="testRoutes()">Test All Routes</button>
            <div id="routesStatus" class="status info">Klik tombol untuk test routes</div>
        </div>

        <!-- Test 4: Manual Admin Link -->
        <div class="test-section">
            <h3>4. Manual Test</h3>
            <button onclick="window.location.href='/admin-antrian'">Buka Admin Dashboard</button>
            <div class="status info">
                Atau buka manual: <a href="/admin-antrian">http://127.0.0.1:8000/admin-antrian</a>
            </div>
        </div>
    </div>

    <script>
        const baseURL = 'http://127.0.0.1:8000';

        async function testTambahAntrian() {
            const nama = document.getElementById('testNama').value;
            const statusDiv = document.getElementById('tambahStatus');

            if (!nama) {
                statusDiv.textContent = '❌ Masukkan nama antrian dulu!';
                statusDiv.className = 'status error';
                return;
            }

            statusDiv.textContent = '⏳ Testing tambah antrian...';
            statusDiv.className = 'status info';

            try {
                const formData = new FormData();
                formData.append('nama', nama);

                // Get CSRF token first
                const response = await fetch(baseURL + '/', {
                    method: 'GET'
                });

                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const csrfToken = doc.querySelector('meta[name="csrf-token"]')?.getAttribute('content');

                if (!csrfToken) {
                    throw new Error('CSRF token not found');
                }

                // Submit form
                const submitResponse = await fetch(baseURL + '/antrian/store-admin', {
                    method: 'POST',
                    headers: {
                        'X-CSRF-TOKEN': csrfToken,
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `nama=${encodeURIComponent(nama)}&_token=${encodeURIComponent(csrfToken)}`
                });

                if (submitResponse.redirected) {
                    statusDiv.textContent = '✅ Berhasil! Redirect ke admin dashboard. Cek dashboard untuk antrian baru.';
                    statusDiv.className = 'status success';
                } else {
                    const result = await submitResponse.text();
                    statusDiv.textContent = '✅ Berhasil! Response: ' + result.substring(0, 100) + '...';
                    statusDiv.className = 'status success';
                }

            } catch (error) {
                statusDiv.textContent = '❌ Error: ' + error.message;
                statusDiv.className = 'status error';
            }
        }

        async function testRecall() {
            const id = document.getElementById('recallId').value;
            const statusDiv = document.getElementById('recallStatus');

            if (!id) {
                statusDiv.textContent = '❌ Masukkan ID antrian dulu!';
                statusDiv.className = 'status error';
                return;
            }

            statusDiv.textContent = '⏳ Testing panggil ulang...';
            statusDiv.className = 'status info';

            try {
                // Get CSRF token first
                const response = await fetch(baseURL + '/', {
                    method: 'GET'
                });

                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const csrfToken = doc.querySelector('meta[name="csrf-token"]')?.getAttribute('content');

                if (!csrfToken) {
                    throw new Error('CSRF token not found');
                }

                // Submit recall
                const submitResponse = await fetch(baseURL + `/antrian/${id}/recall`, {
                    method: 'POST',
                    headers: {
                        'X-CSRF-TOKEN': csrfToken,
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `_token=${encodeURIComponent(csrfToken)}`
                });

                if (submitResponse.redirected) {
                    statusDiv.textContent = '✅ Recall request sent! Cek dashboard untuk response.';
                    statusDiv.className = 'status success';
                } else {
                    const result = await submitResponse.text();
                    statusDiv.textContent = '✅ Recall response: ' + result.substring(0, 100) + '...';
                    statusDiv.className = 'status success';
                }

            } catch (error) {
                statusDiv.textContent = '❌ Error: ' + error.message;
                statusDiv.className = 'status error';
            }
        }

        function testRoutes() {
            const statusDiv = document.getElementById('routesStatus');
            const routes = [
                'GET /',
                'GET /admin-antrian',
                'POST /antrian/store-admin',
                'POST /antrian/{id}/recall',
                'POST /antrian/{id}/panggil',
                'POST /antrian/{id}/selesai',
                'POST /antrian/{id}/terlewat',
            ];

            statusDiv.innerHTML = '✅ Routes yang tersedia:<br>' +
                routes.map(route => `• ${route}`).join('<br>');
            statusDiv.className = 'status success';
        }

        // Auto-test routes on load
        window.addEventListener('load', function() {
            testRoutes();
        });
    </script>
</body>
</html>
