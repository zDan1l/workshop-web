<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test ElevenLabs TTS - Sistem Antrian</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10">
    <div class="container mx-auto px-4">
        <div class="max-w-4xl mx-auto">
            <!-- Header -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">🎙️ Test ElevenLabs TTS</h1>
                <p class="text-gray-600">Test integrasi ElevenLabs Text-to-Speech untuk sistem antrian</p>
            </div>

            <!-- Test Connection -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                <h2 class="text-xl font-semibold mb-4">🔌 Test Koneksi ElevenLabs</h2>
                <div class="space-y-4">
                    <button onclick="testConnection()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
                        Test Connection
                    </button>
                    <div id="connection-result" class="hidden p-4 rounded"></div>
                </div>
            </div>

            <!-- Test Queue TTS -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                <h2 class="text-xl font-semibold mb-4">🎯 Test Antrian TTS</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Nomor Antrian:</label>
                        <input type="text" id="test-nomor" value="A001" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Nama Pelanggan:</label>
                        <input type="text" id="test-nama" value="Budi Santoso" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button onclick="testQueueTTS()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">
                        Generate & Play TTS
                    </button>
                    <div id="tts-result" class="hidden p-4 rounded"></div>
                </div>
            </div>

            <!-- Test Custom TTS -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                <h2 class="text-xl font-semibold mb-4">✨ Test Custom TTS</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Custom Text:</label>
                        <textarea id="custom-text" rows="3" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">Halo! Selamat datang di layanan kami.</textarea>
                    </div>
                    <button onclick="testCustomTTS()" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded">
                        Generate & Play Custom TTS
                    </button>
                    <div id="custom-tts-result" class="hidden p-4 rounded"></div>
                </div>
            </div>

            <!-- Audio Player -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                <h2 class="text-xl font-semibold mb-4">🔊 Audio Player</h2>
                <audio id="audio-player" controls class="w-full"></audio>
                <div id="audio-url" class="mt-2 text-sm text-gray-600"></div>
            </div>

            <!-- Logs -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-semibold mb-4">📋 Test Logs</h2>
                <div id="logs" class="bg-gray-800 text-green-400 p-4 rounded font-mono text-sm max-h-96 overflow-y-auto">
                    <div>🚀 Ready for testing...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Helper function to add logs
        function addLog(message) {
            const logsDiv = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            logsDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        // Helper function to show result
        function showResult(elementId, message, isSuccess) {
            const resultDiv = document.getElementById(elementId);
            resultDiv.classList.remove('hidden');
            resultDiv.className = `p-4 rounded ${isSuccess ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`;
            resultDiv.textContent = message;
        }

        // Test connection to ElevenLabs
        async function testConnection() {
            addLog('🔌 Testing ElevenLabs connection...');

            try {
                const response = await fetch('/api/tts/test');
                const data = await response.json();

                if (data.success) {
                    addLog('✅ Connection successful!');
                    showResult('connection-result', `✅ ${data.message}`, true);

                    // Load audio into player
                    document.getElementById('audio-player').src = data.audio_url;
                    document.getElementById('audio-url').textContent = `Audio URL: ${data.audio_url}`;
                } else {
                    addLog(`❌ Connection failed: ${data.message}`);
                    showResult('connection-result', `❌ ${data.message}`, false);
                }
            } catch (error) {
                addLog(`❌ Error: ${error.message}`);
                showResult('connection-result', `❌ Error: ${error.message}`, false);
            }
        }

        // Test Queue TTS
        async function testQueueTTS() {
            const nomor = document.getElementById('test-nomor').value;
            const nama = document.getElementById('test-nama').value;

            if (!nomor || !nama) {
                showResult('tts-result', '❌ Please fill in all fields', false);
                return;
            }

            addLog(`🎯 Testing Queue TTS for: ${nomor} - ${nama}`);

            try {
                const response = await fetch('/api/tts/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]').getAttribute('content')
                    },
                    body: JSON.stringify({ nomor, nama })
                });

                const data = await response.json();

                if (data.success) {
                    addLog('✅ Queue TTS generated successfully!');
                    showResult('tts-result', `✅ ${data.message}`, true);

                    // Load audio into player
                    document.getElementById('audio-player').src = data.audio_url;
                    document.getElementById('audio-url').textContent = `Audio URL: ${data.audio_url}`;

                    // Auto-play
                    document.getElementById('audio-player').play();
                } else if (data.fallback) {
                    addLog('⚠️ Fallback activated: ' + data.message);
                    showResult('tts-result', `⚠️ ${data.message}`, false);
                } else {
                    addLog(`❌ TTS generation failed: ${data.message}`);
                    showResult('tts-result', `❌ ${data.message}`, false);
                }
            } catch (error) {
                addLog(`❌ Error: ${error.message}`);
                showResult('tts-result', `❌ Error: ${error.message}`, false);
            }
        }

        // Test Custom TTS
        async function testCustomTTS() {
            const text = document.getElementById('custom-text').value;

            if (!text) {
                showResult('custom-tts-result', '❌ Please enter some text', false);
                return;
            }

            addLog(`✨ Testing Custom TTS: "${text}"`);

            try {
                const response = await fetch('/api/tts/custom', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]').getAttribute('content')
                    },
                    body: JSON.stringify({ text })
                });

                const data = await response.json();

                if (data.success) {
                    addLog('✅ Custom TTS generated successfully!');
                    showResult('custom-tts-result', `✅ ${data.message}`, true);

                    // Load audio into player
                    document.getElementById('audio-player').src = data.audio_url;
                    document.getElementById('audio-url').textContent = `Audio URL: ${data.audio_url}`;

                    // Auto-play
                    document.getElementById('audio-player').play();
                } else if (data.fallback) {
                    addLog('⚠️ Fallback activated: ' + data.message);
                    showResult('custom-tts-result', `⚠️ ${data.message}`, false);
                } else {
                    addLog(`❌ Custom TTS generation failed: ${data.message}`);
                    showResult('custom-tts-result', `❌ ${data.message}`, false);
                }
            } catch (error) {
                addLog(`❌ Error: ${error.message}`);
                showResult('custom-tts-result', `❌ Error: ${error.message}`, false);
            }
        }

        // Auto-test connection on page load
        window.addEventListener('load', () => {
            addLog('🚀 Page loaded. Ready for testing!');
            setTimeout(testConnection, 1000);
        });
    </script>
</body>
</html>
